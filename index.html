<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AISO 聯盟一體機 - 訂單管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-600 text-white p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wide">AISO 聯盟一體機訂單管理系統</h1>
      <button onclick="openOrderModal(null)" class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-lg font-medium shadow transition">
        + 新增訂單 (業務專用)
      </button>
    </div>
  </header>

  <main class="max-w-[98%] mx-auto py-6">
    <!-- 篩選與搜尋列 -->
    <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap gap-4 items-center justify-between">
      <div class="flex flex-wrap gap-4 items-center">
        <div>
          <label class="font-semibold text-slate-600 text-sm">訂單狀態：</label>
          <select id="filterStatus" onchange="renderOrders()" class="border border-slate-300 rounded-lg p-1.5 text-sm outline-none">
            <option value="ALL">全部狀態</option>
            <option value="待處理">待處理</option>
            <option value="已領貨">已領貨</option>
            <option value="出貨中">出貨中</option>
            <option value="出貨完成">出貨完成</option>
            <option value="已安裝">已安裝</option>
          </select>
        </div>
        <div>
          <label class="font-semibold text-slate-600 text-sm">發票狀態：</label>
          <select id="filterInvoice" onchange="renderOrders()" class="border border-slate-300 rounded-lg p-1.5 text-sm outline-none">
            <option value="ALL">全部</option>
            <option value="未開發票">未開發票</option>
            <option value="已開發票">已開發票</option>
          </select>
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="fetchOrdersFromSheet()" class="bg-slate-100 hover:bg-slate-200 border px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1">
          <span id="refreshIcon">🔄</span> 重新整理資料
        </button>
        <input type="text" id="searchInput" oninput="renderOrders()" placeholder="搜尋客戶、業務、ERP、單號、窗口..." class="border border-slate-300 rounded-lg p-2 text-sm w-64 outline-none">
      </div>
    </div>

    <!-- 訂單列表表格 -->
    <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
      <table class="w-full text-left border-collapse min-w-[1600px]">
        <thead class="bg-slate-100 border-b border-slate-200">
          <tr>
            <th class="p-3 font-semibold text-slate-600 text-sm">單號/客戶/ERP</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">預計出貨日</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">硬體資訊與保固</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">軟體資訊與保固</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">保固窗口/注意事項</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">金額與付款餘額</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">物流資訊</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">付款狀態</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">發票狀態</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">訂單狀態</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">備註記錄</th>
            <th class="p-3 font-semibold text-slate-600 text-sm">操作</th>
          </tr>
        </thead>
        <tbody id="orderTableBody">
          <tr><td colspan="12" class="p-8 text-center text-slate-400">正在從雲端載入資料中...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- 建立 / 編輯訂單 Modal -->
  <div id="orderModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-3xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <h2 id="modalTitle" class="text-xl font-bold mb-4 text-slate-800">建立 AISO 一體機新訂單</h2>
      <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
        <input type="hidden" id="editOrderId">

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1 text-indigo-700">訂單編號/單號 (可自訂)</label>
            <input type="text" id="customOrderId" placeholder="例：AISO-2024-001" class="w-full border border-indigo-300 rounded-lg p-2 text-sm font-mono bg-indigo-50/20">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">客戶名稱</label>
            <input type="text" id="custName" required class="w-full border rounded-lg p-2 text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">負責業務</label>
            <input type="text" id="salesName" required class="w-full border rounded-lg p-2 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">ERP 單號 (選填)</label>
            <input type="text" id="erpId" placeholder="例如：ERP-20240901" class="w-full border rounded-lg p-2 text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">預計出貨日期</label>
            <input type="date" id="shipDate" required class="w-full border rounded-lg p-2 text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">檔案連結 (附件/目錄)</label>
            <input type="url" id="fileUrl" placeholder="https://..." class="w-full border rounded-lg p-2 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">硬體資訊 (機型/序號)</label>
            <textarea id="hwInfo" rows="2" placeholder="例：AISO-Pro / SN:883920" required class="w-full border rounded-lg p-2 text-sm"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">軟體資訊 (版本/授權)</label>
            <textarea id="swInfo" rows="2" placeholder="例：AISO OS v3.1" required class="w-full border rounded-lg p-2 text-sm"></textarea>
          </div>
        </div>

        <!-- 保固區塊 (非必填) -->
        <div class="bg-amber-50/60 p-3 rounded-lg border border-amber-200 space-y-3">
          <div class="text-xs font-bold text-amber-800 flex items-center gap-1">🛡️ 保固資訊設定 (選填)</div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">硬體保固起訖時間</label>
              <div class="flex items-center gap-1">
                <input type="date" id="hwWarrantStart" class="w-full border rounded p-1.5 text-xs bg-white">
                <span class="text-xs text-slate-400">至</span>
                <input type="date" id="hwWarrantEnd" class="w-full border rounded p-1.5 text-xs bg-white">
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">軟體保固起訖時間</label>
              <div class="flex items-center gap-1">
                <input type="date" id="swWarrantStart" class="w-full border rounded p-1.5 text-xs bg-white">
                <span class="text-xs text-slate-400">至</span>
                <input type="date" id="swWarrantEnd" class="w-full border rounded p-1.5 text-xs bg-white">
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">保固對接窗口 (姓名/電話/Email)</label>
              <input type="text" id="warrantyContact" placeholder="例：張工程師 0912-345678 / tech@test.com" class="w-full border rounded p-1.5 text-xs bg-white">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">保固注意事項</label>
              <input type="text" id="warrantyNote" placeholder="例：人為損壞不在保固範圍，軟體提供首年免費更新" class="w-full border rounded p-1.5 text-xs bg-white">
            </div>
          </div>
        </div>

        <!-- 金額與付款條件欄位 -->
        <div class="bg-slate-50 p-3 rounded-lg border space-y-3">
          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">總金額 (NT$)</label>
              <input type="number" id="totalAmount" oninput="calculateBalance()" placeholder="300000" required class="w-full border rounded-lg p-2 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">付款狀態</label>
              <select id="paymentStatus" onchange="handlePaymentStatusChange()" class="w-full border rounded-lg p-2 text-sm">
                <option value="未付款">未付款</option>
                <option value="已付訂金">已付訂金</option>
                <option value="已結清">已結清</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">已付訂金金額</label>
              <input type="number" id="depositAmount" oninput="calculateBalance()" placeholder="0" class="w-full border rounded-lg p-2 text-sm">
            </div>
          </div>
          <div id="balanceBox" class="text-xs font-semibold text-emerald-600 bg-emerald-50 p-2 rounded hidden">
            💡 自動計算應補尾款餘額：NT$ <span id="balanceText">0</span>
          </div>
        </div>

        <!-- 物流欄位 -->
        <div class="bg-blue-50/50 p-3 rounded-lg border border-blue-100 grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-700">物流公司 (選填)</label>
            <input type="text" id="logisticsCompany" placeholder="例：黑貓宅急便 / 新竹物流" class="w-full border rounded-lg p-2 text-sm bg-white">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-700">物流單號 (選填)</label>
            <input type="text" id="logisticsNo" placeholder="例：9083928102" class="w-full border rounded-lg p-2 text-sm bg-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">發票狀態</label>
            <select id="invoiceStatus" class="w-full border rounded-lg p-2 text-sm">
              <option value="未開發票">未開發票</option>
              <option value="已開發票">已開發票</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">訂單狀態</label>
            <select id="orderStatus" class="w-full border rounded-lg p-2 text-sm font-semibold">
              <option value="待處理">待處理</option>
              <option value="已領貨">已領貨</option>
              <option value="出貨中">出貨中</option>
              <option value="出貨完成">出貨完成</option>
              <option value="已安裝">已安裝</option>
            </select>
          </div>
        </div>

        <div id="initialNoteBox">
          <label class="block text-sm font-medium mb-1">初始備註</label>
          <input type="text" id="initialNote" placeholder="注意事項..." class="w-full border rounded-lg p-2 text-sm">
        </div>

        <div class="flex justify-end gap-3 mt-6">
          <button type="button" onclick="toggleModal('orderModal', false)" class="px-4 py-2 border rounded-lg text-sm hover:bg-slate-100">取消</button>
          <button type="submit" id="submitBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">儲存訂單</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 新增備註 Modal -->
  <div id="noteModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold mb-2">新增售後/庫存備註</h3>
      <p id="noteTargetOrder" class="text-xs font-mono text-indigo-600 mb-4"></p>
      <input type="hidden" id="currentOrderId">
      <textarea id="newNoteText" rows="3" placeholder="請輸入服務進度或庫存調撥備註..." class="w-full border rounded-lg p-2 text-sm mb-4"></textarea>
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('noteModal', false)" class="px-3 py-1.5 border rounded-lg text-sm">取消</button>
        <button onclick="saveNote()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm">新增紀錄</button>
      </div>
    </div>
  </div>

  <script>
    // 指定 Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwnkgcv6qLn14osE6Z1-xNEB-OX9ej6iaogKo_0msv2WTdzGJ_urm-iA8-OzhDjlupPjw/exec";

    let orders = [];

    function toggleModal(id, show) {
      document.getElementById(id).classList.toggle("hidden", !show);
    }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    function handlePaymentStatusChange() {
      const pStatus = document.getElementById("paymentStatus").value;
      const balanceBox = document.getElementById("balanceBox");
      if (pStatus === "已付訂金") {
        balanceBox.classList.remove("hidden");
        calculateBalance();
      } else {
        balanceBox.classList.add("hidden");
      }
    }

    function calculateBalance() {
      const total = parseFloat(document.getElementById("totalAmount").value) || 0;
      const deposit = parseFloat(document.getElementById("depositAmount").value) || 0;
      const balance = Math.max(0, total - deposit);
      document.getElementById("balanceText").innerText = balance.toLocaleString();
    }

    function openOrderModal(orderId = null) {
      document.getElementById("orderForm").reset();
      document.getElementById("editOrderId").value = "";
      document.getElementById("shipDate").value = new Date().toISOString().split('T')[0];

      if (orderId) {
        // 編輯模式
        const o = orders.find(item => item.orderId === orderId);
        if (!o) return;

        document.getElementById("modalTitle").innerText = "✏️ 編輯訂單：" + o.orderId;
        document.getElementById("editOrderId").value = o.orderId;
        document.getElementById("customOrderId").value = o.orderId;
        document.getElementById("customOrderId").disabled = true;

        document.getElementById("custName").value = o.customer;
        document.getElementById("salesName").value = o.sales;
        document.getElementById("erpId").value = o.erpId || "";
        document.getElementById("shipDate").value = o.shipDate !== "-" ? o.shipDate : new Date().toISOString().split('T')[0];
        document.getElementById("hwInfo").value = o.hardware;
        document.getElementById("swInfo").value = o.software;

        document.getElementById("hwWarrantStart").value = o.hwWarrantStart || "";
        document.getElementById("hwWarrantEnd").value = o.hwWarrantEnd || "";
        document.getElementById("swWarrantStart").value = o.swWarrantStart || "";
        document.getElementById("swWarrantEnd").value = o.swWarrantEnd || "";
        document.getElementById("warrantyContact").value = o.warrantyContact || "";
        document.getElementById("warrantyNote").value = o.warrantyNote || "";

        document.getElementById("totalAmount").value = o.amount;
        document.getElementById("paymentStatus").value = o.paymentStatus || "未付款";
        document.getElementById("depositAmount").value = o.deposit || 0;
        document.getElementById("invoiceStatus").value = o.invoiceStatus || "未開發票";
        document.getElementById("orderStatus").value = o.status || "待處理";
        document.getElementById("logisticsCompany").value = o.logisticsCompany || "";
        document.getElementById("logisticsNo").value = o.logisticsNo || "";
        document.getElementById("fileUrl").value = o.fileUrl || "";
        document.getElementById("initialNoteBox").classList.add("hidden");
      } else {
        // 新增模式
        document.getElementById("modalTitle").innerText = "建立 AISO 一體機新訂單";
        document.getElementById("customOrderId").disabled = false;
        document.getElementById("customOrderId").value = "ORD-" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById("initialNoteBox").classList.remove("hidden");
      }

      handlePaymentStatusChange();
      toggleModal("orderModal", true);
    }

    async function fetchOrdersFromSheet() {
      const refreshIcon = document.getElementById("refreshIcon");
      if (refreshIcon) refreshIcon.classList.add("animate-spin");

      try {
        const response = await fetch(API_URL + "?t=" + new Date().getTime(), { redirect: 'follow' });
        const data = await response.json();

        orders = data.map(item => {
          const orderId = String(item["."] || item["訂單編號"] || item.orderId || "").trim();
          
          let shipDateRaw = item["L"] || item["預計出貨日期"] || item.shipDate || "";
          let formattedShipDate = shipDateRaw;
          if (shipDateRaw && String(shipDateRaw).includes("T")) {
            formattedShipDate = String(shipDateRaw).split("T")[0];
          }

          const formatDate = (val) => {
            if (!val) return "";
            return String(val).includes("T") ? String(val).split("T")[0] : String(val);
          };

          return {
            orderId: orderId,
            customer: item["B"] || item["客戶名稱"] || "",
            sales: item["C"] || item["業務姓名"] || "",
            hardware: item["D"] || item["硬體資訊"] || "",
            software: item["E"] || item["軟體資訊"] || "",
            amount: parseFloat(item["F"] || item["總金額"] || 0),
            paymentStatus: item["G"] || item["付款狀態"] || "未付款",
            invoiceStatus: item["H"] || item["發票狀態"] || "未開發票",
            status: item["I"] || item["訂單狀態"] || "待處理",
            fileUrl: item["J"] || item["檔案連結"] || "",
            notes: (item["K"] || item["備註歷史"]) ? String(item["K"] || item["備註歷史"]).split("\n") : [],
            shipDate: formattedShipDate || "-",
            erpId: item["M"] || item["ERP編號"] || "",
            deposit: parseFloat(item["N"] || item["已付訂金金額"] || 0),
            logisticsCompany: item["O"] || item["物流公司"] || "",
            logisticsNo: item["P"] || item["物流單號"] || "",
            hwWarrantStart: formatDate(item["Q"] || item["硬體保固開始"]),
            hwWarrantEnd: formatDate(item["R"] || item["硬體保固結束"]),
            swWarrantStart: formatDate(item["S"] || item["軟體保固開始"]),
            swWarrantEnd: formatDate(item["T"] || item["軟體保固結束"]),
            warrantyContact: item["U"] || item["保固對接窗口"] || "",
            warrantyNote: item["V"] || item["保固注意事項"] || ""
          };
        }).filter(o => o.orderId && o.orderId !== "訂單編號" && o.orderId !== ".");

        renderOrders();
      } catch (err) {
        console.error("讀取失敗：", err);
        document.getElementById("orderTableBody").innerHTML = `<tr><td colspan="12" class="p-8 text-center text-rose-500">無法讀取資料，請確認網路連線。</td></tr>`;
      } finally {
        if (refreshIcon) refreshIcon.classList.remove("animate-spin");
      }
    }

    function renderOrders() {
      const tbody = document.getElementById("orderTableBody");
      const filterSt = document.getElementById("filterStatus").value;
      const filterInv = document.getElementById("filterInvoice").value;
      const search = document.getElementById("searchInput").value.toLowerCase();

      tbody.innerHTML = "";

      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-slate-400">目前尚無訂單資料，或點擊右上角重新整理</td></tr>`;
        return;
      }

      orders.filter(o => {
        const matchSt = filterSt === "ALL" || o.status === filterSt;
        const matchInv = filterInv === "ALL" || o.invoiceStatus === filterInv;
        const matchSearch = String(o.customer).toLowerCase().includes(search) || 
                            String(o.sales).toLowerCase().includes(search) || 
                            String(o.erpId).toLowerCase().includes(search) || 
                            String(o.warrantyContact).toLowerCase().includes(search) || 
                            String(o.orderId).toLowerCase().includes(search);
        return matchSt && matchInv && matchSearch;
      }).forEach(o => {
        const tr = document.createElement("tr");
        tr.className = "border-b border-slate-100 hover:bg-slate-50/80 text-sm";
        
        const notesHtml = Array.isArray(o.notes) && o.notes.length > 0
          ? o.notes.map(n => `<div class="text-xs text-slate-600 bg-slate-100 p-1 rounded mb-1">${n}</div>`).join('')
          : `<div class="text-xs text-slate-400">-</div>`;

        const balance = Math.max(0, o.amount - o.deposit);

        tr.innerHTML = `
          <td class="p-3">
            <div class="font-mono font-bold text-indigo-600">${o.orderId}</div>
            <div class="font-medium text-slate-800">${o.customer || '-'}</div>
            <div class="text-xs text-slate-400">業務: ${o.sales || '-'}</div>
            ${o.erpId ? `<div class="text-xs font-mono text-indigo-500 bg-indigo-50 inline-block px-1 rounded mt-1">ERP: ${o.erpId}</div>` : ''}
          </td>
          <td class="p-3">
            <span class="inline-block bg-slate-100 px-2 py-1 rounded text-xs font-mono font-medium text-slate-700">
              📅 ${o.shipDate}
            </span>
          </td>
          <td class="p-3 text-xs">
            <div class="font-medium text-slate-800 truncate max-w-[140px]" title="${o.hardware}">${o.hardware || '-'}</div>
            ${(o.hwWarrantStart || o.hwWarrantEnd) ? `
              <div class="text-[11px] text-amber-700 bg-amber-50 p-1 rounded mt-1">
                🛡️ 保固: ${o.hwWarrantStart || '?'} ~ ${o.hwWarrantEnd || '?'}
              </div>
            ` : '<div class="text-slate-400 text-[11px]">無保固紀錄</div>'}
          </td>
          <td class="p-3 text-xs">
            <div class="font-medium text-slate-800 truncate max-w-[140px]" title="${o.software}">${o.software || '-'}</div>
            ${(o.swWarrantStart || o.swWarrantEnd) ? `
              <div class="text-[11px] text-indigo-700 bg-indigo-50 p-1 rounded mt-1">
                🛡️ 保固: ${o.swWarrantStart || '?'} ~ ${o.swWarrantEnd || '?'}
              </div>
            ` : '<div class="text-slate-400 text-[11px]">無保固紀錄</div>'}
          </td>
          <td class="p-3 text-xs">
            ${o.warrantyContact ? `<div class="font-medium text-slate-700">👤 ${o.warrantyContact}</div>` : ''}
            ${o.warrantyNote ? `<div class="text-slate-500 text-[11px] bg-slate-100 p-1 rounded mt-1">⚠️ ${o.warrantyNote}</div>` : ''}
            ${(!o.warrantyContact && !o.warrantyNote) ? '<span class="text-slate-300">-</span>' : ''}
          </td>
          <td class="p-3">
            <div class="font-semibold text-slate-700">NT$ ${o.amount.toLocaleString()}</div>
            ${o.paymentStatus === '已付訂金' ? `
              <div class="text-xs text-emerald-600">已付訂金: $${o.deposit.toLocaleString()}</div>
              <div class="text-xs text-rose-500 font-medium">餘額尾款: $${balance.toLocaleString()}</div>
            ` : ''}
          </td>
          <td class="p-3 text-xs">
            ${(o.logisticsCompany || o.logisticsNo) ? `
              <div class="font-medium text-slate-700">${o.logisticsCompany || '物流'}</div>
              <div class="font-mono text-slate-500">${o.logisticsNo || '-'}</div>
            ` : '<span class="text-slate-300">-</span>'}
          </td>
          <td class="p-3">
            <select onchange="updateOrderField('${o.orderId}', 'paymentStatus', this.value)" class="text-xs border rounded p-1 bg-white">
              ${["未付款", "已付訂金", "已結清"].map(p => 
                `<option value="${p}" ${String(o.paymentStatus).includes(p) ? 'selected' : ''}>${p}</option>`
              ).join('')}
            </select>
          </td>
          <td class="p-3">
            <select onchange="updateOrderField('${o.orderId}', 'invoiceStatus', this.value)" class="text-xs font-semibold border rounded p-1 ${o.invoiceStatus === '已開發票' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'}">
              <option value="未開發票" ${o.invoiceStatus === '未開發票' ? 'selected' : ''}>未開發票</option>
              <option value="已開發票" ${o.invoiceStatus === '已開發票' ? 'selected' : ''}>已開發票</option>
            </select>
          </td>
          <td class="p-3">
            <select onchange="updateOrderField('${o.orderId}', 'status', this.value)" class="text-xs border rounded p-1 bg-white font-medium">
              ${["待處理", "已領貨", "出貨中", "出貨完成", "已安裝"].map(st => 
                `<option value="${st}" ${o.status === st ? 'selected' : ''}>${st}</option>`
              ).join('')}
            </select>
          </td>
          <td class="p-3 max-w-[180px]">
            ${notesHtml}
          </td>
          <td class="p-3">
            <div class="flex flex-col gap-1">
              <button onclick="openOrderModal('${o.orderId}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded border">
                ✏️ 編輯
              </button>
              <button onclick="openNoteModal('${o.orderId}')" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 py-1 rounded border border-indigo-200">
                + 備註
              </button>
              ${o.fileUrl ? `<a href="${o.fileUrl}" target="_blank" class="text-xs text-blue-500 underline">附件</a>` : ''}
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function submitOrder(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "同步至雲端中...";
      submitBtn.disabled = true;

      const editOrderId = document.getElementById("editOrderId").value;
      const isEdit = !!editOrderId;

      const userOrderId = document.getElementById("customOrderId").value.trim();
      const finalOrderId = userOrderId || ("ORD-" + Math.floor(1000 + Math.random() * 9000));

      const initialNoteText = document.getElementById("initialNote").value;
      const dateStr = new Date().toLocaleDateString();

      const payload = {
        action: isEdit ? "update" : "create",
        orderId: isEdit ? editOrderId : finalOrderId,
        customer: document.getElementById("custName").value,
        sales: document.getElementById("salesName").value,
        erpId: document.getElementById("erpId").value,
        shipDate: document.getElementById("shipDate").value,
        hardware: document.getElementById("hwInfo").value,
        software: document.getElementById("swInfo").value,

        hwWarrantStart: document.getElementById("hwWarrantStart").value,
        hwWarrantEnd: document.getElementById("hwWarrantEnd").value,
        swWarrantStart: document.getElementById("swWarrantStart").value,
        swWarrantEnd: document.getElementById("swWarrantEnd").value,
        warrantyContact: document.getElementById("warrantyContact").value,
        warrantyNote: document.getElementById("warrantyNote").value,

        amount: parseFloat(document.getElementById("totalAmount").value) || 0,
        paymentStatus: document.getElementById("paymentStatus").value,
        deposit: parseFloat(document.getElementById("depositAmount").value) || 0,
        invoiceStatus: document.getElementById("invoiceStatus").value,
        status: document.getElementById("orderStatus").value,
        logisticsCompany: document.getElementById("logisticsCompany").value,
        logisticsNo: document.getElementById("logisticsNo").value,
        fileUrl: document.getElementById("fileUrl").value
      };

      if (!isEdit && initialNoteText) {
        payload.note = `[${dateStr} 建立] ${initialNoteText}`;
      }

      toggleModal('orderModal', false);

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        await delay(1500);
        fetchOrdersFromSheet();

      } catch(err) {
        console.error("操作失敗：", err);
      } finally {
        submitBtn.innerText = "儲存訂單";
        submitBtn.disabled = false;
      }
    }

    function openNoteModal(orderId) {
      document.getElementById("currentOrderId").value = orderId;
      document.getElementById("noteTargetOrder").innerText = "針對單號: " + orderId;
      document.getElementById("newNoteText").value = "";
      toggleModal('noteModal', true);
    }

    async function saveNote() {
      const orderId = document.getElementById("currentOrderId").value;
      const text = document.getElementById("newNoteText").value.trim();
      if (!text) return;

      const order = orders.find(o => o.orderId === orderId);
      if (order) {
        if (!Array.isArray(order.notes)) order.notes = [];
        const dateStr = new Date().toLocaleDateString();
        order.notes.push(`[${dateStr}] ${text}`);

        toggleModal('noteModal', false);

        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "update",
            orderId: orderId,
            note: order.notes.join("\n")
          })
        });

        await delay(1000);
        fetchOrdersFromSheet();
      }
    }

    async function updateOrderField(orderId, field, value) {
      const order = orders.find(o => o.orderId === orderId);
      if (order) {
        order[field] = value;

        let payload = { action: "update", orderId: orderId };
        payload[field] = value;

        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      }
    }

    fetchOrdersFromSheet();
  </script>
</body>
